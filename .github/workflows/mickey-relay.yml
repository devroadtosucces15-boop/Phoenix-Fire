name: Mickey relay

# EA blocks Cloudflare, but lets Actions through. The Worker dispatches this job with only a club name/ID; the job asks EA, draws the
# pictures with Chrome, uploads them to the Worker and finishes the waiting Discord reply. On a schedule it also feeds tracked clubs' new matches.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "waiting request id", required: false }
      kind: { description: "search | stats | track | poll | draw | banners", required: false, default: poll }
      q: { description: "club name or id", required: false }
      game: { description: "which match (1 = latest)", required: false, default: "1" }
      extra: { description: "extra picture to draw (compare: names)", required: false }
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: mickey-relay-${{ github.event_name }}-${{ inputs.ref || inputs.kind || 'poll' }}-${{ inputs.q }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: mickey-ball-bot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pictures need Chrome (preinstalled) and playwright-core
        if: ${{ inputs.kind != 'search' }}
        working-directory: mickey-ball-bot
        run: npm install --no-save --no-audit --no-fund playwright-core@1.48.0
      - name: Ask EA, draw, answer the bot
        working-directory: mickey-ball-bot
        env:
          CHROME_PATH: /usr/bin/google-chrome
          RELAY_REF: ${{ inputs.ref }}
          RELAY_KIND: ${{ inputs.kind || 'poll' }}
          RELAY_Q: ${{ inputs.q }}
          RELAY_GAME: ${{ inputs.game || '1' }}
          RELAY_EXTRA: ${{ inputs.extra }}
          MICKEY_WORKER_URL: ${{ secrets.MICKEY_WORKER_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node relay/relay.mjs
