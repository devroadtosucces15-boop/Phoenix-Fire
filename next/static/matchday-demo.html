<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix Matchday · /host Interactive Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1e1f22;
    color: #dbdee1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 18px 16px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Demo Simulator Controls */
  .sim-bar {
    width: 100%;
    max-width: 640px;
    background: #141518;
    border: 1px solid #35373c;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .sim-group {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #949ba4;
  }
  .sim-group label { font-weight: 700; color: #b5bac1; text-transform: uppercase; font-size: 10px; letter-spacing: 0.6px; }
  .sim-select, .sim-btn {
    background: #2b2d31;
    color: #f2f3f5;
    border: 1px solid #404249;
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .sim-btn:hover { background: #383a40; }
  .view-toggle {
    display: inline-flex;
    background: #0d0e11;
    border: 1px solid #35373c;
    border-radius: 7px;
    padding: 2px;
    gap: 2px;
  }
  .vt-btn {
    background: transparent;
    color: #949ba4;
    border: none;
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.14s;
  }
  .vt-btn.active {
    background: #23262e;
    color: #fbbf24;
    box-shadow: 0 0 0 1px rgba(245,158,11,0.45);
  }
  .v2-section-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .b-counter-gold {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #14161a;
    border: 1px solid rgba(245, 158, 11, 0.7);
    box-shadow: 0 0 9px rgba(245, 158, 11, 0.25);
    border-radius: 5px;
    padding: 2.5px 7px;
    font-size: 10px;
    font-weight: 800;
    color: #f4f4f5;
    white-space: nowrap;
  }

  .ext-header-left {
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .ext-crest {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #f59e0b;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
    background: #0a0705;
    padding: 1.5px;
    flex-shrink: 0;
  }
  .line-stats {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 10px;
    font-weight: 800;
    color: #d4d4d8;
    letter-spacing: 0.3px;
  }
  .ls-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    padding: 2px 6px;
  }

  .chem-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .form-dots {
    display: inline-flex;
    gap: 2px;
    margin-left: 4px;
    align-items: center;
  }
  .fd {
    width: 5px; height: 5px; border-radius: 50%;
  }
  .fd.w { background: #4ade80; }
  .fd.d { background: #fbbf24; }
  .fd.l { background: #f87171; }
  .pro-strip {
    background: linear-gradient(90deg, rgba(245,158,11,0.12), rgba(34,197,94,0.08));
    border-top: 1px solid rgba(245,158,11,0.32);
    padding: 5px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    color: #e4e4e7;
  }

  .ls-dot { width: 6px; height: 6px; border-radius: 50%; }

  .ui-ico { width: 14px; height: 14px; flex-shrink: 0; display: inline-block; }


  .channel-wrap {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .channel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    color: #f2f3f5;
    padding: 0 4px;
  }
  .channel-head span.sub { font-size: 11px; color: #949ba4; font-weight: 500; }

  /* Discord Message */
  .discord-msg {
    background: #313338;
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid #3f4147;
  }
  .discord-msg.ephemeral {
    background: #1a1c22;
    border: 1px solid #343844;
    animation: fadeIn 0.18s ease-out;
  }
  .discord-msg.checkin {
    background: #25302a;
    border: 1px solid #2d6a4f;
    animation: fadeIn 0.18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .msg-row { display: flex; gap: 12px; }
  .bot-avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: #0a0705; border: 1px solid #3f434e; flex-shrink: 0;
  }
  .msg-body { flex: 1; min-width: 0; }
  .msg-author { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .author-name { font-weight: 700; font-size: 14.5px; color: #f2f3f5; }
  .app-badge { background: #5865f2; color: #fff; font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
  .msg-time { font-size: 11px; color: #949ba4; }
  .mention {
    display: inline-block; background: rgba(88,101,242,0.25); color: #c9cdfb;
    font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-bottom: 8px;
  }

  /* Components v2 Container */
  .v2-card {
    background: #2b2d31;
    border: 1px solid #3f4147;
    border-left: 4px solid #f59e0b;
    border-radius: 8px;
    padding: 12px;
    transition: border-left-color 0.2s;
  }
  .v2-card.closed { border-left-color: #ef4444; }
  .v2-card.cancelled { border-left-color: #6b7280; opacity: 0.85; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .eyebrow { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #a1a1aa; text-transform: uppercase; }
  .session-title { font-size: 17px; font-weight: 800; color: #f2f3f5; margin-top: 2px; }
  .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 11.5px; color: #b5bac1; }
  .ts-chip { background: #383a40; padding: 2px 6px; border-radius: 4px; color: #dbdee1; font-weight: 500; }
  .count-pill {
    background: #14161a; border: 1px solid rgba(245, 158, 11, 0.65); border-radius: 6px;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.24);
    padding: 4px 8px; font-size: 11.5px; font-weight: 700; color: #f2f3f5; white-space: nowrap;
  }
  .status-pill-closed {
    background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.6); color: #fca5a5;
    border-radius: 6px; padding: 4px 9px; font-size: 11px; font-weight: 800; letter-spacing: 0.4px; white-space: nowrap;
  }

  /* Composite Graphic */
  .graphic {
    background: #0b0c0e;
    border: 1px solid rgba(245, 158, 11, 0.65);
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.22), inset 0 0 0 1px rgba(251, 191, 36, 0.12);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 11px;
  }
  .graphic-banner {
    background: linear-gradient(90deg, #111216 0%, #181a20 50%, #111216 100%);
    border-bottom: 1px solid rgba(245, 158, 11, 0.45);
    box-shadow: 0 1px 8px rgba(245, 158, 11, 0.14);
    padding: 8px 11px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .banner-left { display: flex; align-items: center; gap: 8px; }
  .banner-crest { width: 28px; height: 28px; object-fit: cover; border-radius: 50%; border: 1.5px solid #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.5); background: #0a0705; padding: 1px; }
  .banner-kicker { font-size: 9px; font-weight: 800; letter-spacing: 1.1px; color: #a1a1aa; text-transform: uppercase; }
  .banner-title { font-size: 13px; font-weight: 800; color: #fff; line-height: 1.1; }
  .banner-right { display: flex; gap: 5px; align-items: center; }
  .b-badge {
    font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 5px;
    background: #23262e; border: 1px solid #3f434e; color: #f4f4f5;
  }
  .b-badge.dark { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); color: #e5e7eb; }
  .b-badge.closed { background: rgba(239,68,68,0.24); border-color: #ef4444; color: #fca5a5; }

  .graphic-body {
    display: grid;
    grid-template-columns: 1.36fr 1fr;
    min-height: 405px;
  }
  @media (max-width: 560px) {
    .graphic-body { grid-template-columns: 1.25fr 1fr; min-height: 290px; }
    .pos-circle { width: 24px; height: 24px; font-size: 7px; }
    .av { width: 13px; height: 13px; font-size: 7px; }
    .p-name { font-size: 8.5px; }
    .t-prim { font-size: 7px; padding: 1px 3px; }
    .t-flex { font-size: 6.5px; padding: 0.5px 2.5px; }
    .roster { padding: 5px 5px; }
    .roster-foot { font-size: 7.5px; }
  }

  /* Vertical Pitch */
  .pitch {
    position: relative;
    background: repeating-linear-gradient(180deg, #0c2a16 0px, #0c2a16 25px, #0f311b 25px, #0f311b 50px);
    border-right: 1px solid rgba(245, 158, 11, 0.42);
    overflow: hidden;
  }
  .pitch-lines { position: absolute; inset: 9px; border: 1.5px solid rgba(255,255,255,0.22); border-radius: 3px; }
  .halfway { position: absolute; top: 50%; left: 0; right: 0; border-top: 1.5px solid rgba(255,255,255,0.22); }
  .center-circle { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 1.5px solid rgba(255,255,255,0.22); border-radius: 50%; }
  .box-top { position: absolute; top: 0; left: 50%; width: 112px; height: 42px; margin-left: -56px; border: 1.5px solid rgba(255,255,255,0.22); border-top: none; }
  .box-bot { position: absolute; bottom: 0; left: 50%; width: 112px; height: 42px; margin-left: -56px; border: 1.5px solid rgba(255,255,255,0.22); border-bottom: none; }

  .spot {
    position: absolute;
    transform: translate(-50%, -16px);
    display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 2;
  }
  .pos-circle {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5px; font-weight: 900; letter-spacing: 0.2px; color: #fff;
    background: #14161a; border: 2px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.65);
    position: relative; z-index: 2;
    overflow: hidden;
  }
  .pos-circle .bg-emblem {
    position: absolute;
    inset: -3px;
    width: calc(100% + 6px);
    height: calc(100% + 6px);
    opacity: 0.44;
    filter: blur(1.2px);
    pointer-events: none;
    z-index: 0;
  }
  .pos-circle .pos-txt {
    position: relative;
    z-index: 1;
    text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.9);
  }
  .pos-circle.att { border-color: #ef4444; background: radial-gradient(circle at 30% 30%, #3b1212, #150909); }
  .pos-circle.cam { border-color: #f59e0b; background: radial-gradient(circle at 30% 30%, #3b2708, #161006); }
  .pos-circle.wide { border-color: #06b6d4; background: radial-gradient(circle at 30% 30%, #09323d, #061418); }
  .pos-circle.cdm { border-color: #a855f7; background: radial-gradient(circle at 30% 30%, #2a1242, #12081b); font-size: 7.5px; }
  .pos-circle.def { border-color: #22c55e; background: radial-gradient(circle at 30% 30%, #0d361d, #07160d); }
  .pos-circle.gk { border-color: #3b82f6; background: radial-gradient(circle at 30% 30%, #102752, #071022); }
  .pos-circle.flex-only { border-color: #f59e0b; border-style: dashed; background: rgba(40,25,6,0.92); color: #fcd34d; }
  .pos-circle.empty { border-color: #ef4444; border-style: dashed; background: rgba(48,10,10,0.92); color: #fca5a5; }

  .av-pill {
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(10, 7, 5, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    padding: 2px 4px;
    margin-top: -5px;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(0,0,0,0.65);
  }
  .av {
    width: 17px; height: 17px; border-radius: 50%; font-size: 8.5px; font-weight: 800; color: #fff;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #0a0705; margin-left: -4px;
  }
  .av:first-child { margin-left: 0; }

  .xi-avatar-circle {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid #f59e0b;
    box-shadow: 0 0 0 1px rgba(251,191,36,0.35), 0 3px 9px rgba(0,0,0,0.75);
    overflow: hidden;
    background: #14161a;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
  }
  .xi-avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .xi-name-pill {
    display: inline-flex; align-items: center; gap: 3.5px;
    background: rgba(10, 7, 5, 0.92);
    border: 1px solid rgba(251, 191, 36, 0.42);
    border-radius: 999px;
    padding: 1.5px 6px 1.5px 2.5px;
    margin-top: -6px;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    white-space: nowrap;
  }
  .xi-name-pill img { width: 12px; height: 12px; border-radius: 2.5px; flex-shrink: 0; }
  .xi-name-pill .nm { font-size: 9px; font-weight: 800; color: #f3f4f6; }
  .xi-name-pill .rt { font-size: 8.5px; font-weight: 900; color: #4ade80; }

  .xi-avatar-circle.ci-ready { border-color: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.55); }
  .xi-avatar-circle.ci-late { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.5); }
  .xi-avatar-circle.ci-wait { border-color: #52525b; opacity: 0.62; box-shadow: none; }
  .ci-dot {
    position: absolute; top: -2px; right: -2px;
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid #0b0c0e;
    display: flex; align-items: center; justify-content: center;
    font-size: 7.5px; font-weight: 900; color: #fff; z-index: 4;
  }
  .ci-dot.ready { background: #22c55e; }
  .ci-dot.late { background: #f59e0b; color: #111; }
  .ci-dot.wait { background: #52525b; }
  .cap-tag {
    position: absolute; top: -3px; left: -3px;
    width: 13px; height: 13px; border-radius: 50%;
    background: #f59e0b; color: #0a0705; border: 1.5px solid #0b0c0e;
    font-size: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 4;
  }
  .ci-badge {
    font-size: 8.5px; font-weight: 800; padding: 1.5px 6px; border-radius: 4px;
  }
  .ci-badge.ready { background: rgba(34,197,94,0.2); border: 1px solid #22c55e; color: #86efac; }
  .ci-badge.late { background: rgba(245,158,11,0.2); border: 1px solid #f59e0b; color: #fcd34d; }
  .ci-badge.wait { background: rgba(113,113,122,0.22); border: 1px solid #52525b; color: #a1a1aa; }

  .xi-name-pill .rt.flex { color: #fcd34d; }

  .av.more {
    background: #1f2937; color: #fcd34d; font-size: 7.5px; font-weight: 900;
    width: 18px; border-color: #f59e0b;
  }
  .flex-hint {
    font-size: 7.5px; font-weight: 800; color: #fcd34d;
    background: rgba(20,14,6,0.85); border: 1px solid rgba(245,158,11,0.45);
    padding: 0.5px 4px; border-radius: 4px;
  }

  /* Right Roster Panel */
  .roster { background: #111317; padding: 8px 9px; display: flex; flex-direction: column; justify-content: space-between; }
  .roster-head {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;
  }
  .roster-head span { font-size: 9px; font-weight: 800; letter-spacing: 0.8px; color: #949ba4; text-transform: uppercase; }
  .roster-head .green { color: #4ade80; }
  .player-list { display: flex; flex-direction: column; gap: 2.5px; flex: 1; }
  .p-row {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding: 2.5px 5px; border-radius: 4px; background: rgba(255,255,255,0.028);
  }
  .p-row.me { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); }
  .p-name { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .p-tags { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
  .t-prim { display: inline-flex; align-items: center; gap: 3px; font-size: 8.5px; font-weight: 800; padding: 1px 5px 1px 2px; border-radius: 4px; }
  .t-prim img { width: 11px; height: 11px; border-radius: 2.5px; flex-shrink: 0; }
  .t-prim.att { background: rgba(239,68,68,0.28); border: 1px solid #ef4444; color: #fca5a5; }
  .t-prim.cam { background: rgba(245,158,11,0.25); border: 1px solid #f59e0b; color: #fcd34d; }
  .t-prim.wide { background: rgba(6,182,212,0.24); border: 1px solid #06b6d4; color: #67e8f9; }
  .t-prim.cdm { background: rgba(168,85,247,0.26); border: 1px solid #a855f7; color: #d8b4fe; }
  .t-prim.def { background: rgba(34,197,94,0.24); border: 1px solid #22c55e; color: #86efac; }
  .t-prim.gk { background: rgba(59,130,246,0.28); border: 1px solid #3b82f6; color: #93c5fd; }
  .t-flex { font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 3px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #9ca3af; }
  .roster-foot { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 9.5px; line-height: 1.45; color: #9ca3af; }
  .roster-foot strong { color: #e5e7eb; }

  /* Buttons */
  .btn-row { display: flex; gap: 7px; width: 100%; flex-wrap: wrap; }
  .btn-row.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .d-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 35px; padding: 0 11px; border-radius: 5px; font-size: 12.5px; font-weight: 600;
    color: #f2f3f5; background: #4e5058; border: none; cursor: pointer; white-space: nowrap;
    transition: filter 0.12s, transform 0.08s;
  }
  .d-btn:hover:not(:disabled) { filter: brightness(1.12); }
  .d-btn:active:not(:disabled) { transform: translateY(1px); }
  .d-btn:disabled { background: #3b3d44 !important; color: #72767d !important; cursor: not-allowed; opacity: 0.72; border-color: transparent !important; }
  .d-btn.grow { flex: 1; }
  .d-btn.green { background: #248046; color: #fff; }
  .d-btn.red { background: #da373c; color: #fff; }
  .d-btn.blurple { background: #5865f2; color: #fff; }
  .d-btn.outline-red { background: rgba(218,55,60,0.16); border: 1px solid rgba(218,55,60,0.5); color: #fca5a5; }
  .d-btn.pos { height: 34px; padding: 0 5px; font-size: 11.5px; font-weight: 700; background: #3f424a; border: 1px solid rgba(255,255,255,0.08); }
  .d-btn.pos.primary { background: #248046; border: 1.5px solid #4ade80; color: #fff; }
  .d-btn.pos.flex { background: #4752c4; border: 1.5px solid #818cf8; color: #fff; }
  .emj { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }

  .hairline { height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03)); margin: 10px 0 7px; }

  const isRight = id.startsWith("R") && (id.endsWith("M") || id.endsWith("W") || id.endsWith("B"));
  let bg = "#22c55e", shape = '<path d="M12 4.5l6.5 2.5v5c0 4-2.8 6.8-6.5 8-3.7-1.2-6.5-4-6.5-8V7z" fill="#fff"/>';
  if (cat === "att") {
    bg = id.startsWith("R") ? "#f4511e" : "#e53935";
    shape = '<path d="M12 4.5l5.5 11.5-5.5-2.8-5.5 2.8z" fill="#fff"/>';
  } else if (cat === "cam") {
    bg = "#f59e0b";
    shape = '<path d="M12 4.2l2.2 4.6 5.1.7-3.7 3.5.9 5-4.5-2.4L7.5 18l.9-5-3.7-3.5 5.1-.7z" fill="#fff"/>';
  } else if (cat === "wide") {
    bg = isRight ? "#0ea5e9" : "#06b6d4";
    shape = isRight
      ? '<path d="M8.5 6.5L15.5 12l-7 5.5v-3.5h-3v-4h3z" fill="#fff"/>'
      : '<path d="M15.5 6.5L8.5 12l7 5.5v-3.5h3v-4h-3z" fill="#fff"/>';
  } else if (cat === "cdm") {
    bg = id.startsWith("R") ? "#a855f7" : "#8b5cf6";
    shape = '<path d="M12 4.5L18.5 12 12 19.5 5.5 12z" fill="#fff"/><circle cx="12" cy="12" r="2.2" fill="'+bg+'"/>';
  } else if (cat === "gk") {
    bg = "#2563eb";
    shape = '<circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="2.5" fill="#fff"/>';
  } else if (cat === "def") {
    bg = id === "LCB" ? "#10b981" : id === "RCB" ? "#14b8a6" : "#22c55e";
  }
  return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect rx="6" width="24" height="24" fill="${bg}"/>${shape}</svg>`);
}

let state = initialState();

function mapPosToFormation(pos, slots) {
  if (slots.some(s => s.id === pos)) return pos;
  const alts = {
    LS:["ST","CF","LW","LF"], RS:["ST","CF","RW","RF"], ST:["LS","RS","CF"],
    LWB:["LB","LM","LW","LCB"], RWB:["RB","RM","RW","RCB"],
    LCM:["CM","CAM","LDM","LCDM","LM"], RCM:["CM","CAM","RDM","RCDM","RM"],
    CDM:["LDM","LCDM","CM","LCM","CB"], CB:["LCB","RCB","CDM"]
  };
  for (const a of (alts[pos] || [])) {
    if (slots.some(s => s.id === a)) return a;
  }
  return slots[0].id;
}

function getSlotCat(id) {
  const s = FORMATIONS[state.formation].find(x => x.id === id);
  return s ? s.cat : "def";
}


function computeStartingXI() {
  const slots = FORMATIONS[state.formation];
  const pool = state.rsvps.filter(r => r.status === "in" && r.positions.length > 0).map((p, idx) => ({
    ...p,
    ovr: p.ovr || 7.8,
    stat: p.stat || "All-Time",
    hasSiteCard: idx % 4 !== 3,
    mapped: [...new Set(p.positions.map(pos => mapPosToFormation(pos, slots)))]
  }));
  const used = new Set();
  const assigned = {};
  slots.forEach(s => {
    const cands = pool.filter(p => !used.has(p.id) && p.mapped[0] === s.id).sort((a,b) => b.ovr - a.ovr);
    if (cands[0]) { assigned[s.id] = { p: cands[0], mode: "primary" }; used.add(cands[0].id); }
  });
  slots.forEach(s => {
    if (assigned[s.id]) return;
    const cands = pool.filter(p => !used.has(p.id) && p.mapped.includes(s.id)).sort((a,b) => b.ovr - a.ovr);
    if (cands[0]) { assigned[s.id] = { p: cands[0], mode: "flex" }; used.add(cands[0].id); }
  });
  // 1-step flex shift for any still-open slot (smart solver!)
  slots.forEach(s => {
    if (assigned[s.id]) return;
    const benchCands = pool.filter(p => !used.has(p.id)).sort((a,b) => b.ovr - a.ovr);
    for (const [otherSlot, pick] of Object.entries(assigned)) {
      if (pick.p.mapped.includes(s.id)) {
        const repl = benchCands.find(b => b.mapped.includes(otherSlot));
        if (repl) {
          assigned[s.id] = { p: pick.p, mode: "flex" };
          assigned[otherSlot] = { p: repl, mode: repl.mapped[0] === otherSlot ? "primary" : "flex" };
          used.add(repl.id);
          break;
        }
      }
    }
  });
  const bench = pool.filter(p => !used.has(p.id)).sort((a,b) => (a.signedInAt || 9e15) - (b.signedInAt || 9e15));
  return { slots, assigned, bench };
}

function render() {
  if (state.stage === 'checkin') { renderCheckinStage(); return; }
  if (state.stage === 'call') { renderLineupStage(true); return; }
  if (state.stage === 'lineup') { renderLineupStage(false); return; }
  const slots = FORMATIONS[state.formation];
  const me = USERS[state.actingAs];
  const inList = state.rsvps.filter(r => r.status === "in" && r.positions.length > 0);
  const maybeList = state.rsvps.filter(r => r.status === "maybe");
  const outList = state.rsvps.filter(r => r.status === "out");

  // Compute primary & flex per slot
  const bySlot = {};
  slots.forEach(s => bySlot[s.id] = { primary: [], flex: [] });
  inList.forEach(p => {
    const mapped = [...new Set(p.positions.map(pos => mapPosToFormation(pos, slots)))];
    p._mapped = mapped;
    const prim = mapped[0];
    if (bySlot[prim]) bySlot[prim].primary.push(p);
    mapped.slice(1).forEach(f => { if (bySlot[f]) bySlot[f].flex.push(p); });
  });

  // Sort roster by formation slot order
  const order = {};
  slots.forEach((s, i) => order[s.id] = i);
  const sortedIn = [...inList].sort((a, b) => (order[a._mapped[0]] ?? 99) - (order[b._mapped[0]] ?? 99));

  const coveredSlots = slots.filter(s => bySlot[s.id].primary.length > 0).length;
  const totalReplied = inList.length + maybeList.length + outList.length;
  const lineCnt = { att: 0, mid: 0, def: 0, gk: 0 };
  inList.forEach(p => {
    const c = getSlotCat(p._mapped[0]);
    if (c === "att") lineCnt.att++;
    else if (c === "gk") lineCnt.gk++;
    else if (c === "def") lineCnt.def++;
    else lineCnt.mid++;
  });
  const timeLabel = fmtSessionLabel(state.sessionTs);
  const isLocked = state.status !== "open";
  const rightTopBadge = state.status === "closed"
    ? `<div class="status-pill-closed">🔒 SIGN-UPS CLOSED</div>`
    : state.status === "cancelled"
    ? `<div class="status-pill-closed" style="border-color:#9ca3af;color:#d1d5db;background:rgba(156,163,175,0.2);">🚫 CANCELLED</div>`
    : `<div class="count-pill">✅ ${inList.length} · ❔ ${maybeList.length} · ❌ ${outList.length}</div>`;

  const spotsHtml = slots.map(s => {
    const d = bySlot[s.id];
    const hasP = d.primary.length > 0;
    const hasF = d.flex.length > 0;
    const pillClass = s.cat;
    const cntClass = hasP ? s.cat : (hasF ? "zero" : "open");
    const shownAvs = d.primary.slice(0, 3);
    const extraAvs = d.primary.length - shownAvs.length;
    const pillInner = hasP
      ? `<div class="av-pill">${shownAvs.map(p => `<div class="av" style="background:${p.color};" title="${p.name} (Primary ${s.id})">${p.initial}</div>`).join("")}${extraAvs > 0 ? `<div class="av more">+${extraAvs}</div>` : ""}</div>`
      : "";
    const flexHtml = hasF ? `<div class="flex-hint">+${d.flex.length} flex</div>` : (!hasP ? `<div class="flex-hint" style="color:#fca5a5;border-color:rgba(239,68,68,0.5);">OPEN</div>` : "");
    return `
      <div class="spot" style="left:${s.x}%; top:${s.y}%;">
        <div class="pos-circle ${pillClass}"><img class="bg-emblem" src="${emblemWatermarkSvg(s.id, s.cat)}" alt=""><span class="pos-txt">${s.id}</span></div>
        ${pillInner}
        ${flexHtml}
      </div>`;
  }).join("");

  const visibleIn = sortedIn.slice(0, 12);
  const hiddenCount = sortedIn.length - visibleIn.length;
  const rosterRowsHtml = visibleIn.map(p => {
    const prim = p._mapped[0];
    const flex = p._mapped.slice(1);
    const cat = getSlotCat(prim);
    const isMe = p.id === me.id;
    return `
      <div class="p-row ${isMe ? 'me' : ''}">
        <span class="p-name"><span class="p-dot" style="background:${p.color};"></span>${p.name}${isMe ? ' (You)' : ''}${state.layoutMode==="pro" ? `<span class="form-dots" title="Last 5 form">${(p.ovr>=8.4?["w","w","w","d","w"]:p.ovr>=8.1?["w","d","w","w","l"]:["w","l","d","w","w"]).map(r=>`<span class="fd ${r}"></span>`).join("")}</span>` : ""}</span>
        <span class="p-tags">
          <span class="t-prim ${cat}"><img src="${emojiSvg(prim, cat)}" alt="">${prim}</span>
          ${flex.map(f => `<span class="t-flex">${f}</span>`).join("")}
        </span>
      </div>`;
  }).join("");

  document.getElementById("publicPost").innerHTML = `

      <img class="bot-avatar" src="./crest-sm.png" alt="Phoenix Fire">
      <div class="msg-body">
        <div class="msg-author">
          <span class="author-name">Phoenix Matchday</span>
          <span class="app-badge">✓ APP</span>
          <span class="msg-time">Today at 9:00 PM</span>

        <div class="v2-card ${state.status}">
          ${(state.layoutMode === "proposed" || state.layoutMode === "pro") ? `
          <div class="v2-section-row">
            <div class="ext-header-left">
              <img class="ext-crest" src="./crest-sm.png" alt="Phoenix Fire">
              <div>
                <div class="eyebrow">PHOENIX FIRE · MATCHDAY</div>
                <div class="session-title">🏆 League Session · ${state.formation}</div>
                <div class="meta-line">
                  <span class="ts-chip">${timeLabel}</span>
                  <span>· Unlimited</span>
                </div>
              </div>
            </div>
            <button class="d-btn" style="height:32px;font-size:12px;" onclick="openSquadHub()"><img class="ui-ico" src="${uiIcon('hub')}">Squad Hub</button>
          </div>
          ` : `
          <div class="card-top">
            <div class="ext-header-left">
              <img class="ext-crest" src="./crest-sm.png" alt="Phoenix Fire">
              <div>
                <div class="eyebrow">PHOENIX FIRE · MATCHDAY</div>
                <div class="session-title">🏆 League Session · ${state.formation}</div>
                <div class="meta-line">
                  <span class="ts-chip">${timeLabel}</span>
                  <span>· Unlimited</span>
                </div>
              </div>
            </div>
            ${rightTopBadge}
          </div>
          `}

          <div class="graphic">
            <div class="graphic-banner">
              <div class="line-stats">
                <span class="ls-chip"><span class="ls-dot" style="background:#ef4444;"></span>ATT ${lineCnt.att}</span>
                <span class="ls-chip"><span class="ls-dot" style="background:#a855f7;"></span>MID ${lineCnt.mid}</span>
                <span class="ls-chip"><span class="ls-dot" style="background:#22c55e;"></span>DEF ${lineCnt.def}</span>
                <span class="ls-chip"><span class="ls-dot" style="background:#3b82f6;"></span>GK ${lineCnt.gk}</span>
              </div>
              <div class="banner-right">
                ${(state.layoutMode === "proposed" || state.layoutMode === "pro") ? `
                  <span class="b-counter-gold"><span style="color:#4ade80;">✓ ${inList.length}</span><span style="color:#52525b;">·</span><span style="color:#fbbf24;">? ${maybeList.length}</span><span style="color:#52525b;">·</span><span style="color:#f87171;">✕ ${outList.length}</span></span>
                ` : ``}
                <span class="b-badge">${state.formation}</span>
                ${state.status === "closed"
                  ? `<span class="b-badge closed">LOCKED</span>`
                  : `<span class="b-badge dark" style="${coveredSlots===11?'border-color:#22c55e;color:#86efac;background:rgba(34,197,94,0.16);':''}">${coveredSlots}/11 FILLED</span>`}
              </div>
            </div>

            <div class="graphic-body">

              <div class="roster">

                  <span style="color:#949ba4;">${totalReplied} REPLIED</span>

                <div class="player-list">${rosterRowsHtml}${hiddenCount > 0 ? `<div class="p-row" style="justify-content:center;background:rgba(245,158,11,0.12);border:1px dashed rgba(245,158,11,0.45);cursor:pointer;" onclick="openFullRoster()"><span style="font-size:9.5px;font-weight:800;color:#fcd34d;">+${hiddenCount} more signed up · Click to view full list</span></div>` : ""}</div>
                <div class="roster-foot">

          </div>

          ${(state.layoutMode === "proposed" || state.layoutMode === "pro") ? `
          <div class="btn-row">
            <button class="d-btn green grow" ${isLocked ? "disabled" : ""} onclick="openPicker()"><img class="ui-ico" src="${uiIcon('in')}">I'm In ›</button>

            <button class="d-btn" ${state.status === "cancelled" ? "disabled" : ""} onclick="openReschedule()">📅 Reschedule</button>
            <button class="d-btn red" ${state.status === "cancelled" ? "disabled" : ""} onclick="cancelSession()">🚫 Cancel</button>
          </div>
          `}
        </div>
      </div>
    </div>
  `;

  renderEphemeral();
  renderCheckin();
}

  if (state.ephemeral.type === "picker") {
    const draft = state.ephemeral.draft;
    const row1 = slots.slice(0, 5);

    const renderBtn = s => {
      const idx = draft.indexOf(s.id);

                <button class="d-btn green grow" ${draft.length===0?"disabled":""} onclick="saveOverride('in')">✓ Set In</button>
                <button class="d-btn" onclick="saveOverride('maybe')">Maybe</button>
                <button class="d-btn red" onclick="saveOverride('out')">Out</button>
              </div>
            </div>
            <div class="eph-meta">👁 Only you can see this · <button onclick="dismissEph()">Dismiss message</button></div>
          </div>
        </div>
      </div>`;
  } else if (state.ephemeral.type === "suggestedXI") {
    const slots = FORMATIONS[state.formation];
    const pool = state.rsvps.filter(r => r.status === "in" && r.positions.length > 0).map((p, idx) => ({
      ...p,
      ovr: p.ovr || 7.8,
      stat: p.stat || "All-Time",
      hasSiteCard: idx % 4 !== 3, // simulate mix of site avatar cards + Discord PFP fallbacks
      mapped: [...new Set(p.positions.map(pos => mapPosToFormation(pos, slots)))]
    }));
    const used = new Set();
    const assigned = {};
    const reasons = [];
    // Pass 1: highest OVR Primary player per slot
    slots.forEach(s => {
      const cands = pool.filter(p => !used.has(p.id) && p.mapped[0] === s.id).sort((a,b) => b.ovr - a.ovr);
      if (cands[0]) {
        assigned[s.id] = { p: cands[0], mode: "primary" };
        used.add(cands[0].id);
        if (cands.length > 1) {
          reasons.push(`<strong>${s.id}:</strong> ${cands[0].name} (${cands[0].ovr.toFixed(1)}) edges ${cands[1].name} (${cands[1].ovr.toFixed(1)}) on all-time rating`);
        }
      }
    });
    // Pass 2: highest OVR Flex player for any unfilled slot
    slots.forEach(s => {
      if (assigned[s.id]) return;
      const cands = pool.filter(p => !used.has(p.id) && p.mapped.includes(s.id)).sort((a,b) => b.ovr - a.ovr);
      if (cands[0]) {
        assigned[s.id] = { p: cands[0], mode: "flex" };
        used.add(cands[0].id);
        reasons.push(`<strong>${s.id} (Flex Fill):</strong> ${cands[0].name} (${cands[0].ovr.toFixed(1)}) covers open slot from ${cands[0].mapped[0]}`);
      }
    });
    const bench = pool.filter(p => !used.has(p.id)).sort((a,b) => b.ovr - a.ovr);
    const starters = Object.values(assigned).map(x => x.p);
    const avgOvr = starters.length ? (starters.reduce((a,b) => a + b.ovr, 0) / starters.length).toFixed(2) : "—";
    const primCount = Object.values(assigned).filter(x => x.mode === "primary").length;
    const flexCount = Object.values(assigned).filter(x => x.mode === "flex").length;

    const xiSpots = slots.map(s => {
      const pick = assigned[s.id];
      if (!pick) {
        return `<div class="spot" style="left:${s.x}%; top:${s.y}%;">
          <div class="pos-circle ${s.cat}"><img class="bg-emblem" src="${emblemWatermarkSvg(s.id, s.cat)}" alt=""><span class="pos-txt">${s.id}</span></div>
          <div class="flex-hint" style="color:#fca5a5;border-color:rgba(239,68,68,0.5);">OPEN</div>
        </div>`;
      }
      const p = pick.p;
      const srcType = p.hasSiteCard ? "Site Avatar Card" : "Discord PFP Fallback";
      return `<div class="spot" style="left:${s.x}%; top:${s.y}%;">
        <div class="xi-avatar-circle" title="${p.name} · ${srcType} · ${p.stat}">
          <img src="${playerPortraitSvg(p, p.hasSiteCard)}" alt="${p.name}">
        </div>
        <div class="xi-name-pill">
          <img src="${emojiSvg(s.id, s.cat)}" alt="${s.id}">
          <span class="nm">${p.name}</span>
          <span class="rt ${pick.mode==='flex'?'flex':''}">${p.ovr.toFixed(1)}</span>
        </div>
      </div>`;
    }).join("");

    area.innerHTML = `
      <div class="discord-msg ephemeral">
        <div class="msg-row">
          <img class="bot-avatar" src="./crest-sm.png">
          <div class="msg-body">
            <div class="msg-author">
              <span class="author-name">Phoenix Matchday</span>
              <span class="app-badge">✓ APP</span>
              <span class="msg-time">Manager Visualizer · All-Time Stats</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;">
              <div>
                <div style="font-size:14px;font-weight:800;color:#fff;">✨ Suggested XI · ${state.formation}</div>
                <div style="font-size:11px;color:#b5bac1;">Gold circles = Site Avatar Card (Discord PFP fallback) · Pill = Position Icon + Name + OVR</div>
              </div>
              <span class="b-badge" style="border-color:#4ade80;color:#86efac;background:rgba(34,197,94,0.16);">AVG ${avgOvr}</span>
            </div>

            <div class="pitch" style="height:370px;border:1px solid rgba(245,158,11,0.6);box-shadow:0 0 12px rgba(245,158,11,0.2);border-radius:8px;margin-bottom:8px;">
              <div class="pitch-lines"><div class="box-top"></div><div class="halfway"></div><div class="center-circle"></div><div class="box-bot"></div></div>
              ${state.layoutMode === "pro" ? (() => {
                const filled = slots.filter(s => assigned[s.id]);
                let lines = "";
                for (let i = 0; i < filled.length; i++) {
                  for (let j = i + 1; j < filled.length; j++) {
                    const a = filled[i], b = filled[j];
                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    if (dist < 34) {
                      const avg = (assigned[a.id].p.ovr + assigned[b.id].p.ovr) / 2;
                      const col = avg >= 8.4 ? "#4ade80" : (avg >= 8.1 ? "#fbbf24" : "#94a3b8");
                      lines += `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${col}" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="${avg>=8.4?'':'4 3'}"/>`;
                    }
                  }
                }
                return `<svg class="chem-svg">${lines}</svg>`;
              })() : ""}
              ${xiSpots}
            </div>

            <div style="font-size:11px;color:#cbd5e1;background:rgba(0,0,0,0.26);border:1px solid rgba(255,255,255,0.07);padding:8px 10px;border-radius:6px;margin-bottom:8px;line-height:1.5;">
              <div style="font-weight:800;color:#fbbf24;font-size:10px;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:3px;">Why This Lineup (${primCount} Primary · ${flexCount} Flex)</div>
              ${reasons.slice(0, 3).map(r => `<div>• ${r}</div>`).join("") || "<div>• Every starter matched their Primary position by highest all-time rating.</div>"}
              <div style="margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.08);color:#949ba4;">
                <strong style="color:#e5e7eb;">Bench (${bench.length}):</strong> ${bench.length ? bench.map(b => `${b.name} (${b.ovr.toFixed(1)} · ${b.mapped[0]})`).join(", ") : "None"}
              </div>
            </div>

            ${me.isManager ? `
            <div class="btn-row">
              <button class="d-btn blurple grow" onclick="closeAndLineup()">✨ Lock &amp; Load Suggested XI ↗</button>
              <button class="d-btn grow" onclick="closeAndLineup()">🎛 Choose Manually in Dugout ↗</button>
            </div>` : ``}
            <div class="eph-meta">👁 Only you can see this (${me.isManager ? "Manager view · Dugout controls enabled" : "Member view · Read-only"}) · <button onclick="dismissEph()">Dismiss message</button></div>
          </div>
        </div>
      </div>`;
  } else if (state.ephemeral.type === "fullRoster") {
    const slots = FORMATIONS[state.formation];
    const inAll = state.rsvps
      .filter(r => r.status === "in" && r.positions.length > 0)
      .sort((a, b) => (a.signedInAt || 9e15) - (b.signedInAt || 9e15));
    const lines = inAll.map((p, i) => {
      const m = [...new Set(p.positions.map(pos => mapPosToFormation(pos, slots)))];
      const cat = getSlotCat(m[0]);
      const note = p.edited
        ? `<span style="font-size:9px;color:#94a3b8;margin-left:4px;">(edited · kept time)</span>`
        : (p.fromMaybe ? `<span style="font-size:9px;color:#fbbf24;margin-left:4px;">(from Maybe)</span>` : "");
      return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:11.5px;">
        <div style="display:flex;align-items:center;gap:7px;min-width:0;">
          <span style="font-size:10px;font-weight:800;color:#fbbf24;width:20px;">#${i+1}</span>
          <span style="font-size:10px;color:#94a3b8;font-variant-numeric:tabular-nums;width:54px;">${fmtTime(p.signedInAt)}</span>
          <span style="font-weight:700;color:#f3f4f6;">${p.name}</span>${note}
        </div>
        <div style="display:flex;align-items:center;gap:3px;flex-shrink:0;">
          <span class="t-prim ${cat}"><img src="${emojiSvg(m[0], cat)}" alt="">${m[0]}</span>
          ${m.slice(1).map(f => `<span class="t-flex">${f}</span>`).join("")}
        </div>
      </div>`;
    }).join("");
    area.innerHTML = `
      <div class="discord-msg ephemeral">
        <div class="msg-row">
          <img class="bot-avatar" src="./crest-sm.png">
          <div class="msg-body">
            <div class="msg-author">
              <span class="author-name">Phoenix Matchday</span>
              <span class="app-badge">✓ APP</span>
              <span class="msg-time">Sign-Up Priority Order (${inAll.length} IN)</span>
            </div>
            <div style="font-size:13.5px;font-weight:800;color:#fff;margin-top:2px;">📋 Full Roster · Sign-Up Sequence</div>
            <div style="font-size:11px;color:#b5bac1;margin:2px 0 8px;">Ordered by first <strong>I'm In</strong> commit time. Editing positions keeps priority; switching from <strong>Maybe → I'm In</strong> starts the clock when you commit.</div>
            <div style="max-height:280px;overflow-y:auto;background:#111317;border:1px solid rgba(245,158,11,0.45);border-radius:7px;">${lines}</div>
            <div class="eph-meta">👁 Only you can see this · <button onclick="dismissEph()">Dismiss message</button></div>
          </div>
        </div>
      </div>`;
  } else if (state.ephemeral.type === "notice") {
    area.innerHTML = `
      <div class="discord-msg ephemeral">
        <div class="msg-row">
          <img class="bot-avatar" src="./crest-sm.png">
          <div class="msg-body">
            <div class="msg-author"><span class="author-name">Phoenix Matchday</span><span class="app-badge">✓ APP</span></div>
            <div style="font-size:13.5px; font-weight:800; color:#fff;">${state.ephemeral.title}</div>
            <div style="font-size:12px; color:#b5bac1; margin-top:3px;">${state.ephemeral.text}</div>
            <div class="eph-meta">👁 Only you can see this · <button onclick="dismissEph()">Dismiss message</button></div>
          </div>
        </div>
      </div>`;
  }
}

function renderCheckin() {
  const el = document.getElementById("checkinArea");
  if (!state.checkinPosted) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <div class="discord-msg checkin">
      <div class="msg-row">
        <img class="bot-avatar" src="./crest-sm.png">
        <div class="msg-body">
          <div class="msg-author">
            <span class="author-name">Phoenix Matchday</span>
            <span class="app-badge">✓ APP</span>
            <span class="msg-time">Posted to #matchday-checkin</span>
          </div>
          <div style="font-size:14px; font-weight:800; color:#86efac;">✅ Lineup Published — Check-In Is Live!</div>
          <div style="font-size:12px; color:#d1fae5; margin:4px 0 9px;">
            Triggered automatically after the manager published the <strong>${state.formation}</strong> XI in the Dugout. Selected players can now confirm lobby attendance.
          </div>
          <div class="btn-row">
            <button class="d-btn green" onclick="alert('Checked in!')">✅ I'm Ready in Lobby</button>
            <button class="d-btn" onclick="alert('Marked Running Late')">⏱ Running Late</button>
          </div>
        </div>
      </div>
    </div>`;
}

window.openPicker = function() {
  const me = USERS[state.actingAs];
  const existing = state.rsvps.find(r => r.id === me.id);
  const slots = FORMATIONS[state.formation];
  const draft = existing && existing.status === "in"
    ? existing.positions.map(p => mapPosToFormation(p, slots))
    : [];
  state.ephemeral = { type: "picker", draft: [...new Set(draft)] };
  render();
};

window.togglePos = function(posId) {
  const d = state.ephemeral.draft;
  const idx = d.indexOf(posId);
  if (idx >= 0) d.splice(idx, 1);
  else if (d.length < 3) d.push(posId);
  renderEphemeral();
};

window.clearDraft = function() {
  state.ephemeral.draft = [];
  renderEphemeral();
};

window.savePositions = function() {
  const me = USERS[state.actingAs];
  const draft = [...state.ephemeral.draft];
  let rec = state.rsvps.find(r => r.id === me.id);
  const wasIn = rec && rec.status === "in" && rec.signedInAt;
  const wasMaybe = rec && rec.status === "maybe";
  if (!rec) {
    rec = { ...me, status: "in", positions: draft, signedInAt: Date.now() };
    state.rsvps.push(rec);
  } else {
    rec.status = "in";
    rec.positions = draft;
    if (wasIn) {
      rec.edited = true; // keeps original signedInAt priority!
    } else {
      rec.signedInAt = Date.now(); // Maybe/Out -> In starts clock NOW
      if (wasMaybe) rec.fromMaybe = true;
    }
  }
  state.ephemeral = {
    type: "notice",
    title: `✅ Saved for ${me.name}!`,
    text: `Primary: <strong>${draft[0]}</strong>${draft.length > 1 ? ` · Flex: <strong>${draft.slice(1).join(", ")}</strong>` : ""}. ${wasIn ? `Original sign-up priority kept (<strong>${fmtTime(rec.signedInAt)}</strong>).` : `Queue timestamp locked at <strong>${fmtTime(rec.signedInAt)}</strong>.`}`
  };
  render();
};

window.setSimpleStatus = function(st) {
  const me = USERS[state.actingAs];
  let rec = state.rsvps.find(r => r.id === me.id);
  if (!rec) { rec = { ...me, status: st, positions: [], signedInAt: null }; state.rsvps.push(rec); }
  else { rec.status = st; rec.positions = []; rec.signedInAt = null; rec.edited = false; }
  state.ephemeral = {
    type: "notice",
    title: st === "maybe" ? `❔ Marked Maybe (${me.name})` : `❌ Marked Out (${me.name})`,
    text: "The public roll call above updated immediately."
  };
  render();
};

window.openSquadHub = function() {
  state.ephemeral = { type: "notice", title: "Squad Hub ↗", text: "Opens the Phoenix Fire Squad Hub web app in a new tab." };
  render();
};

window.closeAndLineup = function() {
  const me = USERS[state.actingAs];
  if (!me.isManager) {
    state.ephemeral = { type: "notice", title: "🔒 Manager Only", text: `${me.name} doesn't have Manager permissions. Switch "Acting As" to Alex (Manager) in the top bar to test this!` };
    render();
    return;
  }
  state.status = "closed";
  state.ephemeral = { type: "dugout" };
  render();
};

window.reopenSignups = function() {
  state.status = "open";
  state.checkinPosted = false;
  state.ephemeral = null;
  render();
};

window.openReschedule = function() {
  const me = USERS[state.actingAs];
  if (!me.isManager) {
    state.ephemeral = { type: "notice", title: "🔒 Manager Only", text: "Only Managers and above can reschedule sessions." };
    render(); return;
  }
  state.ephemeral = { type: "reschedule", draftTs: state.sessionTs };
  render();
};
window.bumpDraftTs = function(deltaMs) {
  state.ephemeral.draftTs += deltaMs;
  renderEphemeral();
};
window.saveReschedule = function() {
  state.sessionTs = state.ephemeral.draftTs;
  state.ephemeral = { type: "notice", title: "📅 Session Rescheduled", text: `Updated to <strong>${fmtSessionLabel(state.sessionTs)}</strong>.` };
  render();
};
window.openOverride = function() {
  const me = USERS[state.actingAs];
  if (!me.isManager) {
    state.ephemeral = { type: "notice", title: "🔒 Manager Only", text: "Only Managers and above can override sign-ups." };
    render(); return;
  }
  const first = state.rsvps[0];
  const slots = FORMATIONS[state.formation];
  state.ephemeral = { type: "override", targetId: first.id, draft: first.positions.map(p => mapPosToFormation(p, slots)) };
  render();
};
window.changeOverrideTarget = function(id) {
  const rec = state.rsvps.find(r => r.id === id);
  const slots = FORMATIONS[state.formation];
  state.ephemeral.targetId = id;
  state.ephemeral.draft = rec ? [...new Set(rec.positions.map(p => mapPosToFormation(p, slots)))] : [];
  renderEphemeral();
};
window.saveOverride = function(st) {
  let rec = state.rsvps.find(r => r.id === state.ephemeral.targetId);
  if (!rec) {
    const extras = { elena:{name:"Elena",initial:"E",color:"#ec4899",ovr:8.2}, kieran:{name:"Kieran",initial:"K",color:"#14b8a6",ovr:8.0}, vini:{name:"Vini",initial:"V",color:"#f97316",ovr:8.3}, toby:{name:"Toby",initial:"T",color:"#6366f1",ovr:7.9} };
    const ex = extras[state.ephemeral.targetId];
    if (!ex) return;
    rec = { id: state.ephemeral.targetId, ...ex, status: "none", positions: [], signedInAt: null };
    state.rsvps.push(rec);
  }
  if (st === "in") {
    const wasIn = rec.status === "in" && rec.signedInAt;
    rec.status = "in";
    rec.positions = [...state.ephemeral.draft];
    if (!wasIn) rec.signedInAt = Date.now(); else rec.edited = true;
  } else {
    rec.status = st;
    rec.positions = [];
    rec.signedInAt = null;
  }
  state.ephemeral = { type: "notice", title: `🛠 Override Saved for ${rec.name}`, text: `Updated ${rec.name} to <strong>${st.toUpperCase()}</strong>${st==="in"?` (${rec.positions.join(", ")})`:""}.` };
  render();
};

window.cancelSession = function() {
  const me = USERS[state.actingAs];
  if (!me.isManager) {
    state.ephemeral = { type: "notice", title: "🔒 Manager Only", text: "Only Managers and above can cancel sessions." };
    render(); return;
  }
  state.status = "cancelled";
  state.ephemeral = { type: "notice", title: "🚫 Session Cancelled", text: "Public post locked and marked cancelled." };
  render();
};

window.simulateDugoutPublish = function() {
  state.checkinPosted = true;
  state.ephemeral = { type: "notice", title: "📋 Dugout Lineup Published!", text: "Check-In post was automatically dispatched below." };
  render();
};

window.dismissEph = function() { state.ephemeral = null; render(); };

window.setStage = function(st) {
  state.stage = st;
  state.ephemeral = null;
  document.getElementById("stHost").classList.toggle("active", st === "host");
  document.getElementById("stCall").classList.toggle("active", st === "call");
  document.getElementById("stCheckin").classList.toggle("active", st === "checkin");
  document.getElementById("stLineup").classList.toggle("active", st === "lineup");
  render();
};
window.setCheckin = function(val) {
  const me = USERS[state.actingAs];
  state.checkinMap[me.id] = val;
  state.ephemeral = { type: "notice", title: val==="ready" ? "✅ Checked In to Lobby!" : val==="late" ? "⏱ Marked Running Late" : "❌ Dropped Out", text: `${me.name}'s lobby status updated live on the Check-In pitch above.` };
  render();
};
window.pingMissing = function() {
  state.ephemeral = { type: "notice", title: "🔔 Missing Starters Pinged", text: "Sent a reminder ping to unchecked starters in #matchday-checkin." };
  renderEphemeral();
};
window.swapSubDemo = function() {
  state.ephemeral = { type: "notice", title: "🔄 Quick Sub Ready", text: "In the live bot, this opens a private 2-dropdown swap (Starter Out → Checked-In Bench Player In) and refreshes both Check-In and Lineup cards live." };
  renderEphemeral();
};
window.openPlayStyles = function() {
  state.ephemeral = { type: "notice", title: "📘 Position Play Styles", text: "Shows your personal role instructions from the Phoenix Fire Handbook for your assigned position." };
  renderEphemeral();
};
window.repostNotice = function() {
  state.ephemeral = { type: "notice", title: "📢 Lineup Refreshed", text: "Official Starting XI graphic refreshed with latest stats and chemistry." };
  renderEphemeral();
};

window.setLayoutMode = function(m) {
  state.layoutMode = m;
  document.getElementById("vtCurrent").classList.toggle("active", m === "current");
  document.getElementById("vtProposed").classList.toggle("active", m === "proposed");
  document.getElementById("vtPro").classList.toggle("active", m === "pro");
  render();
};
window.openFullRoster = function() { state.ephemeral = { type: "fullRoster" }; renderEphemeral(); };
window.openSuggestedXI = function() { state.ephemeral = { type: "suggestedXI" }; renderEphemeral(); };

document.getElementById("formationSelect").addEventListener("change", e => {
  state.formation = e.target.value;
  state.ephemeral = null;
  render();
});
document.getElementById("userSelect").addEventListener("change", e => {
  state.actingAs = e.target.value;
  state.ephemeral = null;
  render();
});
document.getElementById("stressBtn").addEventListener("click", () => {
  const prevMode = state.layoutMode, prevForm = state.formation, prevUser = state.actingAs;
  state = initialState();
  state.layoutMode = prevMode;
  state.formation = prevForm;
  state.actingAs = prevUser;
  const slots = FORMATIONS[state.formation].map(s => s.id);
  const extraNames = ["Rico","Toby","Zane","Milo","Hector","Liam","Jude","Niko","Sami","Kobe","Enzo","Tariq","Dante","Beto","Axel","Vini","Gael","Ivan"];
  const colors = ["#e53935","#f97316","#f59e0b","#06b6d4","#8b5cf6","#ec4899","#10b981","#22c55e","#3b82f6"];
  extraNames.forEach((nm, i) => {
    const p1 = slots[i % slots.length];
    const p2 = slots[(i + 2) % slots.length];
    const p3 = slots[(i + 5) % slots.length];
    state.rsvps.push({ id:"ex"+i, name:nm, initial:nm[0], color:colors[i % colors.length], status:"in", positions:[p1, p2, p3], signedInAt: minsAgo(4 - Math.floor(i/5)), ovr: +(7.3 + (i % 15) * 0.1).toFixed(1), stat:"All-Time" });
  });
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  state = initialState();
  document.getElementById("formationSelect").value = "3-5-2";
  document.getElementById("userSelect").value = "alex";
  render();
});

render();
if (location.search.includes('view=proposed')) setLayoutMode('proposed');
if (location.search.includes('view=pro')) setLayoutMode('pro');
if (location.search.includes('stage=checkin')) setStage('checkin');
if (location.search.includes('stage=lineup')) setStage('lineup');
if (location.search.includes('view=xi')) openSuggestedXI();
</script>
</body>
</html>
