name = "phoenix-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/10 * * * *", "* * * * *"] # every 10 min: site update + checks; every minute: /remind only

[vars]
SITE_URL = "https://devroadtosucces15-boop.github.io/Phoenix-Fire/"
PUBLIC_URL = "https://phoenix-bot.norexunited.workers.dev" # this Worker – Card Studio cards are served from /media/ here (bot/faces.js)
GITHUB_REPO = "devroadtosucces15-boop/Phoenix-Fire"
DISCORD_APP_ID = "1569450321057550537"
DISCORD_PUBLIC_KEY = "997cfab5315bb5bf6941860ea81b3e80b70c74d2649397f28bf7680540722bcb"
# The two lines above are the core app. Extra Discord apps (bot/apps.js, list in bot/README.md) each add their public
# values here, uncommented, once created in the Developer Portal; their bot tokens are secrets (DISCORD_BOT_TOKEN_<APP>).
# Interactions Endpoint URL for each: <PUBLIC_URL>/interactions/<app>.
DISCORD_APP_ID_STATS = "1569608077748080720"
DISCORD_PUBLIC_KEY_STATS = "116456e0f11f872ac6dee8c69a1413c0373f5342fd75a09bf89620753dda2ac3"
DISCORD_APP_ID_TOOLS = "1569608448507650048"
DISCORD_PUBLIC_KEY_TOOLS = "cb15761d8ecfd62313458aadc9648f5c4f50b612650cb48724b1ffe59f3a5848"
DISCORD_APP_ID_FUN = "1569608868533637121"
DISCORD_PUBLIC_KEY_FUN = "68601b9fa1452c857bb903fbfd6a32e91a3c67c754388f39d545ea2e62330d56"
# Discord server, owner/manager roles and every channel are no longer hardcoded here: they live in the Organization config
# (Boardroom → Organization, D1 tables discord_servers / discord_roles / discord_channels) and are read by bot/orgconfig.js (withOrgEnv).
# DISCORD_GUILD_ID, OWNER_ROLE_ID, ADMIN_ROLE_ID and MEMBER_ROLE_ID may still be set as vars/secrets to override the config.
# ADMIN_IDS = bootstrap owner(s): comma-separated Discord USER IDs. A user ID cannot come from the role mapping, so it stays a Worker
# var – set it with `wrangler secret put ADMIN_IDS` or add it back here; without any owner, nobody can open Boardroom to configure the rest.
ADMIN_IDS = "1322770005535756290"
# BE0: Web Push (RFC 8292). Public half of the VAPID keypair – safe to commit, sent to browsers on purpose.
# The private half is VAPID_PRIVATE_KEY, a Worker secret uploaded from the GH Actions secret of the same name.

# P11.1: Workers AI (free 10,000 neurons/day on this account) – image + text models for Phase 11
[ai]
binding = "AI"

# Card Studio: shrinks the background/photo references below the 512px FLUX.2 limit
[images]
binding = "IMAGES"

# P6.3b live chat: one Durable Object per chat room (SQLite-backed class = Workers Free plan)
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# BE8 Hub: one shared Durable Object for the whole club's live "who's here" roster + waves
[[durable_objects.bindings]]
name = "HUB_ROOM"
class_name = "HubRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Redesign BE0 live rooms: generic ClubRoom DO for Locker/Dugout/Studio broadcast (bot/clubroom.js)
[[durable_objects.bindings]]
name = "CLUB_ROOM"
class_name = "ClubRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HubRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ClubRoom"]

[[kv_namespaces]]
binding = "NOREX_KV"
id = "9a3cb9d021a441b1994aee02dcb425e9"

[[d1_databases]]
binding = "DB"
database_name = "phoenix"
database_id = "38a6a5ff-20f3-4ef2-8868-ad12eafa33c5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "phoenix-media"

[[queues.producers]]
binding = "JOBS"
queue = "phoenix-jobs"

[[queues.consumers]]
queue = "phoenix-jobs"
